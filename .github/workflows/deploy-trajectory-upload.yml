name: deploy-trajectory-upload

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to deploy
        required: true
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: trajectory-upload-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production service
    runs-on: ubuntu-latest
    environment: trajectory-upload-production

    steps:
      - name: Check out requested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Sign in to Azure with OIDC
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy exact checked-out revision
        run: ./services/trajectory_upload/scripts/deploy.sh

      - name: Verify production service
        run: ./services/trajectory_upload/scripts/smoke-test.sh
