name: fresh-resolve

# The test workflow checks the locked environment (`uv sync --locked`), but
# `uv tool install benchflow` and `pip install benchflow` never read uv.lock:
# they take the newest versions pyproject.toml allows on the day (typer 0.27
# broke 9 tests while the lock held 0.24). tools/ci/fresh_resolve.sh builds the
# wheel, installs it in a fresh venv with no lock, and runs the unit suite from
# a copy of the checkout without src/. A new upstream release can turn this red
# with no change here, so it runs daily and on changes to what it reads, not on
# every pull request.
on:
  push:
    branches: [main, 'rel-*']
  pull_request:
    paths:
      - pyproject.toml
      - uv.lock
      - constraints.txt
      - tools/ci/**
      - .github/workflows/fresh-resolve.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fresh-resolve:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    # The unit suite takes 60-90 min on this runner (the test workflow's
    # unit legs; a 45-min run here had reached half of it). 45 cancelled
    # every run before it ended, and on 0.10.0's release commit the 3.13 leg
    # ran out 180 (a hang that the daytona pin then fixed) while 3.12 filled
    # the disk: 360 is GitHub's limit for a hosted job, and a hang still ends.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # A fresh resolve with no cache downloads every wheel; 0.10.0's 3.12 leg
      # filled the runner's disk and lost its own log ("No space left on
      # device" writing _diag). The runner's unused SDKs go first.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          # The point is a resolve with nothing reused, so no uv cache.
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      # The wheel the script builds carries bfx only if the checkout has it,
      # and git ignores src/benchflow/_bfx/bin: without it every held Docker
      # start in the suite is refused. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      # The script prints the resolved typer and click; the whole resolve is
      # in $FRESH_RESOLVE_DIR/freeze.txt, uploaded below.
      - name: Fresh resolve and unit suite
        run: tools/ci/fresh_resolve.sh -n auto -q -rfE
        env:
          FRESH_RESOLVE_PYTHON: ${{ matrix.python-version }}
          FRESH_RESOLVE_DIR: ${{ runner.temp }}/fresh-resolve
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"

      - name: Upload the resolved versions
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: fresh-resolve-freeze-${{ matrix.python-version }}
          path: ${{ runner.temp }}/fresh-resolve/freeze.txt
          if-no-files-found: ignore
          retention-days: 14
