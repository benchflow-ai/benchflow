    - name: Build bfx (pinned)
      run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh
    - name: Grading matrix as a run, this shard, without the flood rows
      run: uv run python -m pytest tests/test_grading_integrity_matrix.py -m "grading_matrix and not flood" -k "not flood and not four_million and not fat_link and not walk_tools and not replaces_find" --splits 2 --group ${{ matrix.shard }} -n auto -rs --durations=25
      env:
        BENCHFLOW_DETERMINISTIC_SANDBOX: docker
        BENCHFLOW_TEST_RUN_DEFAULTS: '1'
