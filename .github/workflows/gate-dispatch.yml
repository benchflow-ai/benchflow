# GENERATED by tools/ci/gen_gate_dispatch.py from test.yml: do not edit.
# Regenerate with `uv run python -m tools.ci.gen_gate_dispatch`.
#
# test.yml's jobs for one commit, run by hand on the self-hosted gate runners
# (repository variable BF_GATE_RUNNER; GitHub's runner without it). Never on a
# pull request: a pull request must not reach a self-hosted runner.
name: gate-dispatch

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "The full 40-character commit to gate"
        required: true
        type: string

concurrency:
  group: gate-dispatch-${{ inputs.sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HARBOR_TELEMETRY: "off"

jobs:
  unit:
    name: unit (${{ matrix.python-version }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.12'
        - '3.13'
        shard:
        - 1
        - 2
        - 3
        - 4
    runs-on: ${{ vars.BF_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 150
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        ref: ${{ inputs.sha }}
    - name: The checked-out commit is the one asked for
      env:
        WANT: ${{ inputs.sha }}
      run: |
        printf '%s\n' "$WANT" | grep -Eqx '[0-9a-f]{40}'
        test "$(git rev-parse HEAD)" = "$WANT"
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Set up Python
      run: uv python install ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --extra dev --extra sandbox-daytona --extra sandbox-modal --locked
    - name: Use the release gate's Docker
      run: |
        mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
        test "${#want[@]}" -ge 5
        # A gate VM (a self-hosted runner, gate-dispatch.yml) already has
        # these packages; removing them there deletes their plugin files.
        if [ "$(docker version --format '{{.Server.Version}}' 2>/dev/null)" = 29.1.3 ] \
          && [ "$(docker compose version --short 2>/dev/null)" = "2.40.3+ds1-0ubuntu1~24.04.1" ]; then
          echo "the gate's Docker is already installed"; exit 0
        fi
        sudo systemctl stop docker.socket docker.service containerd.service || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
        for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
          sudo rm -f "$d/docker-compose" "$d/docker-buildx"
        done
        sudo apt-get update -q
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
        sudo systemctl restart docker
        docker version --format 'docker {{.Server.Version}}'
        docker compose version
        test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
        test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"
    - name: Install the bfx toolchain
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
        rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl
    - name: Build bfx (pinned)
      run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh
    - name: Install Playwright Chromium
      run: uv run playwright install --with-deps chromium
    - name: Lint
      if: matrix.shard == 1
      run: uv run ruff check src tests tools
    - name: Format check
      if: matrix.shard == 1
      run: uv run ruff format --check src tests tools
    - name: Type check
      if: matrix.shard == 1
      run: uv run ty check
    - name: Memory and disk before the tests
      run: |
        free -m
        df -h / /tmp
        df -i /
        docker info --format 'docker {{.ServerVersion}} {{.Driver}} {{json .DriverStatus}}' || true
    - name: Test
      run: uv run python -m pytest tests/ -n auto --splits 4 --group ${{ matrix.shard }}
      env:
        BENCHFLOW_DETERMINISTIC_SANDBOX: 'off'
    - name: Ceiling checks, alone
      if: matrix.shard == 1
      run: uv run python -m pytest tests/ -m ceiling -n 0
      env:
        BENCHFLOW_DETERMINISTIC_SANDBOX: 'off'
    - name: Memory and disk after the tests
      if: always()
      run: |
        free -m
        df -h / /tmp
        df -i /
        du -sh "$BASETEMP_ROOT" || true
        sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true
      env:
        BASETEMP_ROOT: /tmp/pytest-of-runner
