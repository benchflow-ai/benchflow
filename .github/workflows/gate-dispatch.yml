  oracle-parity:
    runs-on: ${{ vars.BF_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 120
    env:
      HARBOR_TELEMETRY: 'off'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      with:
        ref: ${{ inputs.sha }}
    - name: The checked-out commit is the one asked for
      env:
        WANT: ${{ inputs.sha }}
      run: |
        printf '%s\n' "$WANT" | grep -Eqx '[0-9a-f]{40}'
        test "$(git rev-parse HEAD)" = "$WANT"
    - name: Where the parity files go
      run: echo "PARITY=$RUNNER_TEMP/parity" >> "$GITHUB_ENV"
    - name: Free the runner's disk
      run: |
        df -h /
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
        df -h /
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: 0.13.4
        checksum: 2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f
        enable-cache: true
    - name: Set up Python
      run: uv python install 3.12
    - name: Install dependencies
      run: uv sync --extra dev --locked
    - name: Use the release gate's Docker
      run: |
        mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
        test "${#want[@]}" -ge 5
        # A gate VM (a self-hosted runner, gate-dispatch.yml) already has
        # these packages; removing them there deletes their plugin files.
        if [ "$(docker version --format '{{.Server.Version}}' 2>/dev/null)" = 29.1.3 ] \
          && [ "$(docker compose version --short 2>/dev/null)" = "2.40.3+ds1-0ubuntu1~24.04.1" ]; then
          echo "the gate's Docker is already installed"; exit 0
        fi
        sudo systemctl stop docker.socket docker.service containerd.service || true
        sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
        for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
          sudo rm -f "$d/docker-compose" "$d/docker-buildx"
        done
        sudo apt-get update -q
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
        sudo systemctl restart docker
        docker version --format 'docker {{.Server.Version}}'
        docker compose version
        test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
        test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"
    - name: Install the bfx toolchain
      run: |
        channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
        rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl
    - name: Build bfx (pinned)
      run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh
    - name: Draw the sample
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        mkdir -p "$PARITY"
        base=""
        if [ -n "$BASE_REF" ]; then
          git fetch --no-tags --deepen=500 origin HEAD || true
          git fetch --no-tags --depth=500 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
          base="origin/$BASE_REF"
        fi
        uv run python -m tools.parity.sample --repo . --rev HEAD ${base:+--base "$base"} \
          --out "$PARITY/sample.tsv"
    - name: Fetch the tasks from their public sources
      run: uv run python -m tools.parity.fetch --sample "$PARITY/sample.tsv" --dest "$PARITY/tasks"
    - name: Run the oracle, then each mismatch alone
      run: 'uv run python -m tools.parity.run --sample "$PARITY/sample.tsv" --tasks "$PARITY/tasks" --jobs "$PARITY/jobs" --out "$PARITY/rows.tsv" --reruns "$PARITY/reruns.tsv" --bench "$PWD/.venv/bin/bench" -P "$(( $(nproc) > 3 ? $(nproc) / 2 : 1 ))"'
    - name: Tally against Harbor 0.26.0
      run: uv run python -m tools.parity.tally --rows "$PARITY/rows.tsv" --reruns "$PARITY/reruns.tsv" --mode pr --summary "$GITHUB_STEP_SUMMARY"
    - name: What the unscored trials say
      if: failure()
      run: |
        df -h / "$RUNNER_TEMP"
        docker system df || true
        find "$PARITY/jobs" -name result.json -print0 2>/dev/null \
          | xargs -0 -r jq -r 'select(.error != null and .error != "") | "\(input_filename): \(.error)"' \
          | cut -c1-4000
    - name: Upload the rows
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
      with:
        name: oracle-parity-rows
        path: |
          ${{ env.PARITY }}/sample.tsv
          ${{ env.PARITY }}/rows.tsv
          ${{ env.PARITY }}/reruns.tsv
        if-no-files-found: ignore
        retention-days: 14
