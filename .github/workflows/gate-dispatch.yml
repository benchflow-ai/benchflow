        uv build --no-sources --out-dir "$RUNNER_TEMP/build-a"
        other="$RUNNER_TEMP/repro-$RANDOM/benchflow"
        mkdir -p "$(dirname "$other")"
        git worktree add --detach "$other" HEAD
        mkdir -p "$other/src/benchflow/_bfx/bin"
        cp -p src/benchflow/_bfx/bin/bfx-* "$other/src/benchflow/_bfx/bin/"
        ( cd "$other" && umask 077 && TZ=Pacific/Kiritimati LC_ALL=C.UTF-8 UV_NO_CACHE=1 \
            uv build --no-sources --out-dir "$RUNNER_TEMP/build-b" )
        ( cd "$RUNNER_TEMP/build-a" && sha256sum benchflow-* ) > "$RUNNER_TEMP/a.sums"
        ( cd "$RUNNER_TEMP/build-b" && sha256sum benchflow-* ) > "$RUNNER_TEMP/b.sums"
