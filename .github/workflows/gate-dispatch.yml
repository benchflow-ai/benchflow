    - name: Deterministic integration tier
      run: uv run python -m pytest tests/test_deterministic_integration.py tests/test_docker_parallel_isolation.py tests/test_integrity_deterministic.py -m deterministic -v -rs --durations=0 --splits 3 --group ${{ matrix.group }}
      env:
