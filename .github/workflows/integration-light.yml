# integration-light — L1: the cheap, ALWAYS-required integration gate.
#
# SECURITY MODEL (read before editing):
#   * plain pull_request, NOT pull_request_target. On pull_request, GitHub gives
#     FORK PRs no secrets, so untrusted fork code can never reach a provider key.
#     Internal PRs (head.repo == benchflow-ai/benchflow) run the real rollout.
#   * The PLANNER (integration_matrix.py), the AGENT JUDGE (agent_judge.py), and
#     the live scenarios ALWAYS load from TRUSTED ORIGIN/MAIN via a sparse
#     checkout — never from the PR head. Only src/benchflow (the code-under-test)
#     comes from the PR head; it is the orchestrator that runs `bench`, but the
#     verdict logic is trusted-main code.
#   * detect-scope holds NO secrets (contents: read only) and runs in seconds so
#     this whole workflow can be UNCONDITIONALLY REQUIRED in branch protection:
#     when the diff needs no rollout it reports a green no-op (should_run=false).
#   * TASK FIXTURES are DATA UNDER TEST, not verdict logic — but they are not
#     inert: docs/examples/task-md/**/task.md carries sandbox.setup_commands and
#     sandbox.docker_image, and each task ships solve.sh + verifier/test.sh. So
#     PR-head fixtures run ONLY in fixture-scenarios, which holds NO secrets and
#     keeps the assertions (tests/) trusted-main. The secret-bearing job never
#     executes a PR's fixtures.
#
# WHY fixture-scenarios EXISTS (the src-only-overlay blind spot):
#   rollout-smoke overlays ONLY src/benchflow onto the trusted base tree, so a PR
#   that must change src AND the in-repo task fixtures together is graded against
#   an INCOHERENT tree: new code + base fixtures. PR #966 (the task-config
#   'environment' -> 'sandbox' rename) hit exactly this — the overlaid new parser
#   correctly rejected base's un-migrated task.md, so a red check reported a
#   version skew the PR itself had already fixed, and main went green the moment
#   both halves landed together. fixture-scenarios grades the coherent PR-head
#   pair; rollout-smoke keeps the trusted-fixture, secret-bearing coverage.
#
# This workflow REPLACES the role of the old integration-eval.yml (L1).
name: integration-light

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A successful unit run on main feeds this live gate; the internal-preview
  # publisher then consumes this workflow's successful completion.  Keep the
  # main-only source checks on rollout-smoke below: workflow_run has access to
  # repository environments, so an untrusted PR completion must stay a no-op.
  workflow_run:
    workflows: ["test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      task:
        description: SkillsBench task to force-run on the smoke lane.
        type: string
        default: jax-computing-basics

# Cancel superseded L1 runs on the same PR branch — this is the fast-feedback
# lane, so a newer push supersedes the older run.
concurrency:
  group: integration-light-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

# Workflow-level least privilege; jobs elevate only what they need.
permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # detect-scope — NO secrets, contents: read. Trusted-main sparse checkout of
  # .github/. Runs the planner over the BASE...HEAD diff. If the diff needs no
  # rollout (scope=none / empty matrix / L0) it reports should_run=false so the
  # required check passes as a cheap green no-op.
  # ----------------------------------------------------------------------------
  detect-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
      base_ref: ${{ steps.refs.outputs.base_ref }}
      head_sha: ${{ steps.refs.outputs.head_sha }}
    steps:
      - name: Resolve refs
        id: refs
        env:
          # On workflow_run, pin trusted infra and code-under-test to the exact
          # commit that the unit workflow tested.  Never follow moving main.
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.workflow_run.head_sha || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          echo "base_ref=$BASE_REF" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # Trusted-main sparse checkout of the planner only (NOT the PR head).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ steps.refs.outputs.base_ref }}
          fetch-depth: 0
          sparse-checkout: |
            .github
            tests/integration
          sparse-checkout-cone-mode: false

      - name: Fetch PR head SHA for the diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Need the head object present locally for `git diff BASE...HEAD`; do
          # NOT check it out — the working tree stays on trusted base.
          git fetch --no-tags origin "$HEAD_SHA" || true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Plan scope (trusted)
        id: scope
        env:
          BASE_REF: ${{ steps.refs.outputs.base_ref }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            if [ "$SOURCE_EVENT" = "push" ] && [ "$SOURCE_BRANCH" = "main" ]; then
              if [ "$SOURCE_CONCLUSION" != "success" ]; then
                echo "::error::unit workflow for main concluded $SOURCE_CONCLUSION; live release gate is red"
                exit 1
              fi
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              echo "Unit-tested main commit $HEAD_SHA requires the live release gate."
            else
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "::notice::workflow_run is not a main push; L1 stays a credential-free no-op"
            fi
            exit 0
          fi
          if [ ! -f .github/scripts/integration_matrix.py ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::trusted base does not contain integration_matrix.py yet; bootstrap PR passes L1 as a green no-op"
            exit 0
          fi
          set +e
          python .github/scripts/integration_matrix.py \
            --base-ref "$BASE_REF" \
            --head-sha "$HEAD_SHA" \
            --diff-from-git \
            --scope auto \
            --out matrix.json
          rc=$?
          set -e
          # exit 2 == hard-ceiling overflow on the planner: surface and fail.
          if [ "$rc" -eq 2 ]; then
            REASON=$(jq -r '.rejected_overflow // "scope exceeded the hard cell ceiling"' matrix.json 2>/dev/null || echo "scope overflow")
            echo "::error::integration scope overflow: $REASON"
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::scope planner failed (exit $rc)"
            exit "$rc"
          fi

          SCOPE=$(jq -r '.scope // "none"' matrix.json)
          NCELLS=$(jq '.matrix | length' matrix.json)
          echo "Planned scope=$SCOPE cells=$NCELLS"
          # No rollout needed (docs-only non-runtime / empty matrix) => green no-op.
          if [ "$SCOPE" = "none" ] || [ "$NCELLS" -eq 0 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no rollout needed for this diff (scope=$SCOPE) — L1 passes as a green no-op"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload matrix plan
        if: steps.scope.outputs.should_run == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: integration-light-matrix
          path: matrix.json
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------------
  # rollout-smoke — ONE real rollout (low-smoke jax-computing-basics, docker,
  # no-skill, --usage-tracking required) + the agent_judge gate + the live
  # oracle/parity scenarios (NOT the agent_rollout one). Internal PRs only.
  # Low-value provider keys only (DEEPSEEK / GEMINI / GITHUB_MODELS); NO Daytona,
  # NO reviewer key. Steps aside when the 'integration:deep' (L2/L3) label is on
  # the PR so the lanes don't double-spend credits.
  # ----------------------------------------------------------------------------
  rollout-smoke:
    needs: detect-scope
    if: >-
      ${{
        needs.detect-scope.outputs.should_run == 'true' &&
        github.repository == 'benchflow-ai/benchflow' &&
        !contains(github.event.pull_request.labels.*.name, 'integration:deep') &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == 'benchflow-ai/benchflow'
          )
        )
      }}
    runs-on: ubuntu-latest
    # Provider credentials live in this environment so they rotate without
    # repo-admin access to Actions secrets.
    environment: pypi-internal-preview
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Provider candidates. The selector probes these in documented order and
      # stops at the first usable key.
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      GLM_BASE_URL: ${{ secrets.GLM_BASE_URL }}
      GLM_MODEL: ${{ secrets.GLM_MODEL }}
      QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY || secrets.BF_TOKEN }}
      LITELLM_BASE_URL: ${{ secrets.LITELLM_BASE_URL || 'http://llm-proxy.eval.all-hands.dev/v1' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN || github.token }}
      # The L1 smoke task. workflow_dispatch can override it.
      SMOKE_TASK: ${{ github.event.inputs.task || 'jax-computing-basics' }}
      BASE_REF: ${{ needs.detect-scope.outputs.base_ref }}
      HEAD_SHA: ${{ needs.detect-scope.outputs.head_sha }}
    steps:
      # Trusted-base checkout: the planner, agent_judge, and live scenarios MUST
      # come from base. The PR-head src/benchflow is overlaid below as the
      # code-under-test (the orchestrator that runs `bench`).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.detect-scope.outputs.base_ref }}
          fetch-depth: 0

      - name: Overlay PR-head src/benchflow (code-under-test)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ needs.detect-scope.outputs.head_sha }}
        run: |
          set -euo pipefail
          # Fetch the PR head and overlay ONLY src/benchflow onto the trusted
          # base tree. Infra (.github, tests/integration) stays trusted-main; the
          # orchestrator code-under-test comes from the PR head.
          git fetch --no-tags origin "$HEAD_SHA"
          git checkout "$HEAD_SHA" -- src/benchflow

      - name: Select integration provider
        run: python .github/scripts/select_integration_provider.py

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra judge --extra sandbox-daytona --locked

      - name: Run one real smoke rollout on Docker
        run: |
          uv run bench eval run \
            --source-repo benchflow-ai/skillsbench \
            --source-path tasks \
            --source-ref main \
            --include "$SMOKE_TASK" \
            --agent "$BENCHFLOW_INTEGRATION_AGENT" \
            --model "$BENCHFLOW_INTEGRATION_MODEL" \
            --sandbox docker \
            --skill-mode no-skill \
            --usage-tracking required \
            --concurrency 1 \
            --agent-idle-timeout 240 \
            --jobs-dir jobs/integration-light

      - name: Agent-judge the rollout and enforce the gate
        run: |
          uv run python tests/integration/agent_judge.py \
            jobs/integration-light \
            --model "$BENCHFLOW_JUDGE_MODEL" \
            --json

      - name: Run the live oracle/parity scenarios
        # Docker<->daytona parity + reaper safety. Two exclusions:
        #   * agent_rollout — the step above already ran a real agent + judge.
        #   * oracle_determinism — fixture-scenarios grades it against the
        #     coherent PR-head pair (code + fixtures); running it here, where
        #     fixtures are base and code is PR-head, is the incoherent-tree
        #     false-red this split exists to remove.
        # The remaining fixture-dependent leg (sandbox_parity) needs
        # DAYTONA_API_KEY, so it cannot move to the secretless job. When the PR
        # changes the fixtures it would hit the same skew, so it is skipped with
        # a LOUD notice rather than failing on a version mismatch the PR already
        # resolved. Coverage is never silently dropped: fixture-scenarios still
        # graded the coherent pair, and main re-runs this leg after merge.
        env:
          FIXTURES_PATH: docs/examples/task-md
        run: |
          set -euo pipefail
          DESELECT="not agent_rollout and not oracle_determinism"
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             ! git diff --quiet "origin/$BASE_REF...$HEAD_SHA" -- "$FIXTURES_PATH"; then
            echo "::notice title=sandbox_parity skipped::This PR changes $FIXTURES_PATH, so this trusted-fixture job would grade PR code against base fixtures (an incoherent tree). The coherent pair was graded by the fixture-scenarios job; this leg re-runs on main after merge."
            DESELECT="$DESELECT and not sandbox_parity"
          fi
          uv run pytest tests/test_integration_suite.py \
            -m integration -k "$DESELECT" \
            -p no:cacheprovider -v

      - name: Upload smoke rollout artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: integration-light-jobs
          path: jobs/integration-light
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------------
  # fixture-scenarios — the COHERENT-TREE half of the live gate. NO SECRETS, so
  # a PR's own task fixtures (setup_commands, solve.sh, verifier/test.sh) can be
  # executed here without anything to exfiltrate: this job holds no provider
  # environment and only contents: read. Verdict integrity is preserved the same
  # way rollout-smoke preserves it — the assertions (tests/) come from trusted
  # base; only src/benchflow AND the task fixtures come from the PR head, and
  # they must agree with each other.
  #
  # Scope is deliberately the Docker+oracle scenario: it needs no provider key
  # and no Daytona token, which is exactly what lets it run secretless. The
  # Daytona parity leg cannot move here (it needs DAYTONA_API_KEY) and stays in
  # rollout-smoke, guarded there by the fixture-drift skip.
  # ----------------------------------------------------------------------------
  fixture-scenarios:
    name: fixture-scenarios
    needs: detect-scope
    if: >-
      ${{
        needs.detect-scope.outputs.should_run == 'true' &&
        github.repository == 'benchflow-ai/benchflow' &&
        !contains(github.event.pull_request.labels.*.name, 'integration:deep') &&
        (
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'workflow_run' &&
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
          ) ||
          github.event_name == 'pull_request'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `environment:` — this job must never hold provider credentials.
    permissions:
      contents: read
    env:
      BASE_REF: ${{ needs.detect-scope.outputs.base_ref }}
      HEAD_SHA: ${{ needs.detect-scope.outputs.head_sha }}
    steps:
      # Trusted-base checkout: the scenarios and their assertions stay base code
      # so a PR cannot rewrite the test that grades it.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ needs.detect-scope.outputs.base_ref }}
          fetch-depth: 0

      - name: Overlay PR-head code AND task fixtures (the coherent pair)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$HEAD_SHA"
          # Both halves from the same commit — that coherence IS the point of
          # this job. Safe only because this job holds no secrets; do NOT copy
          # this overlay into a job that has an `environment:`.
          git checkout "$HEAD_SHA" -- src/benchflow
          git checkout "$HEAD_SHA" -- docs/examples/task-md

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39  # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Run the coherent-tree oracle scenario on Docker
        run: |
          uv run pytest tests/test_integration_suite.py \
            -m integration -k "oracle_determinism" \
            -p no:cacheprovider -v

  # The preview publisher consumes this workflow's overall conclusion.  A
  # condition regression must never turn a skipped live job into a green
  # release gate, so successful-main workflow_run events end here and require
  # both the unit source and the live rollout job to have succeeded.
  release-gate:
    needs: [detect-scope, rollout-smoke, fixture-scenarios]
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Enforce unit and live integration success
        env:
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DETECT_SCOPE_RESULT: ${{ needs.detect-scope.result }}
          ROLLOUT_SMOKE_RESULT: ${{ needs.rollout-smoke.result }}
          FIXTURE_SCENARIOS_RESULT: ${{ needs.fixture-scenarios.result }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          if [ "$SOURCE_CONCLUSION" != "success" ]; then
            echo "::error::unit workflow concluded $SOURCE_CONCLUSION"
            exit 1
          fi
          if [ "$DETECT_SCOPE_RESULT" != "success" ]; then
            echo "::error::integration planning concluded $DETECT_SCOPE_RESULT"
            exit 1
          fi
          if [ "$ROLLOUT_SMOKE_RESULT" != "success" ]; then
            echo "::error::live integration concluded $ROLLOUT_SMOKE_RESULT"
            exit 1
          fi
          # The coherent-tree half is a gate too: without this check, adding it
          # to `needs` would only make the gate WAIT for it, not require it.
          if [ "$FIXTURE_SCENARIOS_RESULT" != "success" ]; then
            echo "::error::fixture scenarios concluded $FIXTURE_SCENARIOS_RESULT"
            exit 1
          fi
          echo "Unit and live integration gates both succeeded."
          mkdir -p release-provenance
          printf '%s\n' "$TESTED_SHA" > release-provenance/tested-sha
          printf '%s\n' "$SOURCE_RUN_NUMBER" > release-provenance/source-run-number

      - name: Upload tested release provenance
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: internal-preview-provenance
          path: release-provenance
          if-no-files-found: error
          retention-days: 14
