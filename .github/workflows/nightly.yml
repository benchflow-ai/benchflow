name: nightly

# The gates too long or too large for a pull request, on the trunk's head
# every night, and then the nightly build (docs/contributing/release.md,
# "Cadence"). Never on a pull request, so nothing here ever runs a fork's code.
#
# - g1-public: gate 1 on every task CI can fetch from its public source,
#   eight shards on GitHub's runners; runs today.
# - window-full: the window check, five runs per user; runs today.
# - g1-full, matrix-floods: the whole 404-task gate 1 from the staged task
#   folders, and the grading matrix's flood rows (millions of names, 900 s
#   caps). They need the gate runners (ephemeral self-hosted GCE, the gate1f
#   recipe, labelled by the repository variable BF_GATE_RUNNER) and wait for
#   them; `gate-runners-missing` says so on every run until then.
# - dogfood: a new user's install of tonight's wheel, the README's steps and
#   one real model run on DeepSeek's own API (a $0.10 cap), from the protected
#   `dogfood-models` environment once an admin sets it up (DOGFOOD_READY=1).
# - build-nightly / publish-nightly: the date-stamped X.Y.Z.devYYYYMMDD build,
#   only when every gate above passed. It publishes to PyPI only from the
#   public trunk with NIGHTLY_PUBLISH=pypi; a private trunk keeps it as an
#   artifact (unreleased code never goes to public PyPI).

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HARBOR_TELEMETRY: "off"

jobs:
  gate-runners-missing:
    if: vars.BF_GATE_RUNNER == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: The gate runners aren't set up
        run: |
          echo "::warning::g1-full and matrix-floods NOT run: no gate runner (set the repository variable BF_GATE_RUNNER to the label of the ephemeral self-hosted Linux x86_64 runners, and BF_GATE_TASKS to the staged task folder on them)."

  g1-public:
    name: g1-public (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # Under the runner's temp folder: upload-artifact refuses a path with "..".
      - name: Where the parity files go
        run: echo "PARITY=$RUNNER_TEMP/parity" >> "$GITHUB_ENV"

      # The hosted runner keeps about 14 GB free on /; the sampled tasks' images
      # (algotune, codepde, lawbench) need more. On 0c6fc44e their builds failed
      # here and passed on a gate VM (oracle-parity 12/12 there). The SDKs this
      # job never uses go first.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Use the release gate's Docker
        run: |
          mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
          test "${#want[@]}" -ge 5
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
          for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
            sudo rm -f "$d/docker-compose" "$d/docker-buildx"
          done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3

      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: This shard's tasks
        run: |
          mkdir -p "$PARITY"
          uv run python -m tools.parity.sample --all --shard ${{ matrix.shard }} --shards 8 --out "$PARITY/sample.tsv"
          uv run python -m tools.parity.fetch --sample "$PARITY/sample.tsv" --dest "$PARITY/tasks"

      - name: Run the oracle, then each mismatch alone
        run: >-
          uv run python -m tools.parity.run --sample "$PARITY/sample.tsv"
          --tasks "$PARITY/tasks" --jobs "$PARITY/jobs"
          --out "$PARITY/rows.tsv" --reruns "$PARITY/reruns.tsv"
          --bench "$PWD/.venv/bin/bench" -P "$(( $(nproc) > 3 ? $(nproc) / 2 : 1 ))"

      - name: Tally against Harbor 0.26.0
        run: >-
          uv run python -m tools.parity.tally --rows "$PARITY/rows.tsv"
          --reruns "$PARITY/reruns.tsv" --mode nightly --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: g1-public-${{ matrix.shard }}
          path: |
            ${{ env.PARITY }}/sample.tsv
            ${{ env.PARITY }}/rows.tsv
            ${{ env.PARITY }}/reruns.tsv
          if-no-files-found: ignore
          retention-days: 30

  g1-full:
    if: vars.BF_GATE_RUNNER != '' && vars.BF_GATE_TASKS != ''
    runs-on: ${{ vars.BF_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      BF_GATE_TASKS: ${{ vars.BF_GATE_TASKS }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Where the parity files go
        run: echo "PARITY=$RUNNER_TEMP/parity" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Every gate-1 task, from the staged folders
        run: |
          mkdir -p "$PARITY"
          uv run python -m tools.parity.sample --every-key --out "$PARITY/sample.tsv"
          uv run python -m tools.parity.run --sample "$PARITY/sample.tsv" --tasks "$BF_GATE_TASKS" \
            --jobs "$PARITY/jobs" --out "$PARITY/rows.tsv" --reruns "$PARITY/reruns.tsv" \
            --bench "$PWD/.venv/bin/bench" -P 6

      - name: Tally against Harbor 0.26.0
        run: >-
          uv run python -m tools.parity.tally --rows "$PARITY/rows.tsv"
          --reruns "$PARITY/reruns.tsv" --mode nightly --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: g1-full
          path: |
            ${{ env.PARITY }}/rows.tsv
            ${{ env.PARITY }}/reruns.tsv
          if-no-files-found: ignore
          retention-days: 30

  matrix-floods:
    if: vars.BF_GATE_RUNNER != ''
    runs-on: ${{ vars.BF_GATE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: The flood rows, one at a time, keeping every job folder
        run: |
          df -h /; df -i /
          uv run python -m pytest tests/test_grading_integrity_matrix.py -m grading_matrix \
            -k "flood or four_million or fat_link or walk_tools or replaces_find" \
            -n 0 -rs --durations=0 --basetemp "$RUNNER_TEMP/floods"
          df -h /; df -i /
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: docker

      - name: Upload the job folders (without the floods themselves)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: matrix-floods-jobs
          path: |
            ${{ runner.temp }}/floods/**/result.json
            ${{ runner.temp }}/floods/**/timing.json
            ${{ runner.temp }}/floods/**/trial.log
            ${{ runner.temp }}/floods/**/integrity/*.json
          if-no-files-found: ignore
          retention-days: 30

  window-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Use the release gate's Docker
        run: |
          mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
          test "${#want[@]}" -ge 5
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
          for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
            sudo rm -f "$d/docker-compose" "$d/docker-buildx"
          done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
          sudo systemctl restart docker
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3

      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Window check, five runs per user
        run: uv run python -m pytest tests/test_egress_window_hostside.py -m window -n 0 -v -rs
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: docker
          BENCHFLOW_WINDOW_RUNS: "5"

  dogfood:
    if: vars.DOGFOOD_READY == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: dogfood-models
    steps:
      - name: Refuse to run outside the protected environment
        env:
          DOGFOOD_ENV: ${{ vars.DOGFOOD_ENV }}
        run: |
          if [ "$DOGFOOD_ENV" != protected ]; then
            echo "::error::dogfood-models is not the protected environment (its variable DOGFOOD_ENV is not 'protected')"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 scripts/build_bfx.sh

      - name: Tonight's wheel, installed as a user would
        run: |
          uv build --no-sources --wheel --out-dir "$RUNNER_TEMP/dist"
          uv tool install --python 3.12 "$(ls "$RUNNER_TEMP"/dist/benchflow-*.whl)"
          bench --version
          bench doctor || true

      - name: README step 2, the oracle with no model
        working-directory: ${{ runner.temp }}
        run: |
          bench run benchflow-ai/skillsbench/tasks/econ-detrending-correlation \
            --agent oracle --sandbox docker --jobs-dir jobs/oracle | tee oracle.log
          grep -q "Score: 1/1" oracle.log

      - name: README step 3 on DeepSeek's own API, capped at $0.10
        working-directory: ${{ runner.temp }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          bench run benchflow-ai/skillsbench/tasks/econ-detrending-correlation \
            --agent openhands --model deepseek/deepseek-flash --sandbox docker \
            --jobs-dir jobs/model --max-cost-usd 0.10

      - name: README step 4, the results
        working-directory: ${{ runner.temp }}
        run: |
          bench results jobs/
          bench eval metrics jobs/model

  build-nightly:
    needs: [g1-public, window-full]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: The nightly's version
        id: version
        run: uv run --with packaging --no-project python tools/release_version.py nightly

      - name: Install the bfx toolchain
        if: steps.version.outputs.publish == 'true'
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl

      - name: Build bfx (pinned)
        if: steps.version.outputs.publish == 'true'
        run: BFX_REQUIRE_PIN=1 scripts/build_bfx.sh

      - name: Build the nightly
        if: steps.version.outputs.publish == 'true'
        run: |
          uv version "${{ steps.version.outputs.version }}" --frozen
          uv build --no-sources
          uv run --with twine --no-project twine check dist/*
          uv run --no-project python tools/check_dist_bfx.py dist

      - name: Keep the nightly
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: nightly-dist
          path: dist/
          retention-days: 14

  publish-nightly:
    needs: [build-nightly]
    if: needs.build-nightly.outputs.publish == 'true' && vars.NIGHTLY_PUBLISH == 'pypi' && github.repository == 'benchflow-ai/benchflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi-nightly
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: The nightly's version, again from the tree
        run: |
          env -u GITHUB_OUTPUT uv run --with packaging --no-project python tools/release_version.py nightly | tee version.txt
          grep -qx "version=${{ needs.build-nightly.outputs.version }}" version.txt

      - name: Fetch the nightly
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: nightly-dist
          path: dist

      - name: Publish the nightly
        run: uv publish
