name: public-release

on:
  push:
    tags:
      - "v*"

# Read-only by default: only the publish job can write.
permissions:
  contents: read

concurrency:
  group: public-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tagged commit's own tests: every job of test.yml (both unit legs,
  # the deterministic integration tier, grading integrity, pip-audit). The
  # 0.10.0rc3 tag published at 20:03Z while the test run on the same commit
  # failed at 21:31Z: the two were separate workflows and nothing waited.
  tests:
    name: Tests of the tagged commit
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # Runs only when every test job passed. There is no switch that publishes
  # without them: a flaky failure is re-run from the run's page ("Re-run
  # failed jobs", kept in the run's history with who started it); a real one
  # is fixed on main and released as a new version.
  publish:
    name: Publish public release
    needs: [tests]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi-public
    # PyPI Trusted Publishing uses OIDC, and GitHub Releases need contents: write.
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          # A publishing build never restores a cache another run saved
          # (cache poisoning; setup-uv turns it off for these events itself).
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "::error::Public release tag ${{ github.ref_name }} points to $tag_commit, which is not on origin/main."
            exit 1
          fi

      # Nothing internal in the tree being published: release records,
      # linear.app links or tracker keys (tools/public_tree_guard.py).
      - name: Public tree guard
        run: uv run --no-project python tools/public_tree_guard.py .

      - name: Validate release tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: uv run --with packaging --no-project python tools/release_version.py public-release

      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal \
            --target x86_64-unknown-linux-musl --target aarch64-unknown-linux-musl

      # Both static binaries, byte for byte the pinned ones
      # (src/benchflow/_bfx/pins.py), or the release stops here.
      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 scripts/build_bfx.sh

      # A snapshot rate past its vendor's announced change would price
      # every such call at the old rate; the unit tests never read
      # the clock, so the release checks it.
      - name: Price snapshot is current
        run: uv run --no-project python tools/check_price_snapshot.py

      - name: Build distributions
        run: uv build --no-sources

      - name: Check distributions
        run: uv run --with twine --no-project twine check dist/*

      - name: Check bfx in distributions
        run: uv run --no-project python tools/check_dist_bfx.py dist

      # Nothing private ships: tools/release_leak_gate.py reads every file of
      # the wheel, the sdist and the docs, with gitleaks and trufflehog pinned
      # by tools/install_leak_scanners.sh. Its patterns and allowlist name what
      # must not ship, so they are this environment's secrets, never files in
      # the repository; without them the gate stops the release. Its log names
      # rules, files and hashes, never the matched text.
      - name: Install the leak scanners (pinned)
        run: tools/install_leak_scanners.sh "$RUNNER_TEMP/leak-scanners"

      - name: Leak gate on the wheel, the sdist and the docs
        env:
          RELEASE_LEAK_PATTERNS: ${{ secrets.RELEASE_LEAK_PATTERNS }}
          RELEASE_LEAK_ALLOWLIST: ${{ secrets.RELEASE_LEAK_ALLOWLIST }}
        run: |
          umask 077
          cfg="$RUNNER_TEMP/leak-gate"
          mkdir -p "$cfg"
          printf '%s' "$RELEASE_LEAK_PATTERNS" > "$cfg/patterns.json"
          printf '%s' "$RELEASE_LEAK_ALLOWLIST" > "$cfg/allowlist.json"
          uv run --no-project python tools/release_leak_gate.py \
            --patterns "$cfg/patterns.json" --allowlist "$cfg/allowlist.json" \
            --scanners "$RUNNER_TEMP/leak-scanners" --report-dir "$cfg/report" \
            dist/*.whl dist/*.tar.gz docs=docs

      - name: Require accepted source and exact distributions
        run: uv run --no-project python tools/check_release_acceptance.py dist

      - name: Publish public release
        run: uv publish

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            pre=()
            if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
              pre=(--prerelease --latest=false)
            fi
            gh release create "$tag" dist/* \
              --title "benchflow ${{ steps.version.outputs.version }}" \
              --generate-notes \
              --verify-tag "${pre[@]}"
          fi

      - name: Summarize release
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Public release published

          Published \`benchflow==${{ steps.version.outputs.version }}\` to PyPI
          and created GitHub release \`${{ github.ref_name }}\`.
          EOF
