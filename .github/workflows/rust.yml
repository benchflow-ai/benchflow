name: rust

# The Rust workspace (crates/, one binary: bench). Pull requests and pushes
# that touch it run fmt, clippy, and the tests on Linux and macOS. A bench-v*
# tag (or a manual run) also builds the release binaries and uploads them,
# with checksums, as workflow artifacts; nothing is published. v* tags are the
# Python package's (public-release.yml), so a bench tag never starts that
# workflow, and a Python tag never starts this one.
on:
  push:
    branches: [main, bench-rs]
    # Path filters are not applied to tag pushes, so every bench-v* tag runs.
    tags: ["bench-v*"]
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "install.sh"
      - "e2e/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.*"
      - "rust-toolchain.toml"
      - "install.sh"
      - "e2e/**"
      - ".github/workflows/rust.yml"
  # No schedule: GitHub runs scheduled workflows only from the default
  # branch, which has no copy of this file, so a cron here never fires.
  workflow_dispatch:

# Cancel superseded runs on a PR branch; never cancel pushes or tags.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: artifacts upload with the runtime token, not GITHUB_TOKEN.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (the channel in rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal -c rustfmt --no-self-update
          rustup show active-toolchain

      - name: cargo fmt --check
        run: cargo fmt --all --check

  check:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (the channel in rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal -c clippy --no-self-update
          rustc --version && cargo --version

      # Pushes to main and bench-rs save the cache; pull requests only read it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          # docs-guard.yml reads this cache under the same key.
          shared-key: workspace
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --workspace --locked

      # GitHub's ubuntu runners have Docker: download from a glibc container
      # through BenchFlow's own `docker exec` arguments (ignored elsewhere).
      - name: glibc download through docker exec
        if: runner.os == 'Linux'
        run: cargo test -p benchflow-sandbox --lib --locked -- --ignored a_glibc_download

      # The black-box suite's scenarios that need no sandbox and no secret,
      # against the bench that cargo test just built. Scenarios that start
      # sandboxes need Docker or a Daytona key; see docs/rust/testing-e2e.md.
      - name: e2e (no sandbox)
        run: python3 e2e/run.py --bench target/debug/bench --backend none --tier full

  # The black-box suite's smoke tier on Docker: its five sandbox scenarios
  # (bench run, bench test, doctor, the failure paths, mounts and hooks)
  # against a debug build, on the runner's own Docker. No secret: no smoke
  # scenario needs a model or Daytona. --require-sandbox fails the job if
  # no sandbox scenario ran, so a skipped tier cannot pass as green.
  e2e-docker:
    name: e2e smoke (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (the channel in rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}

      - name: cargo build -p benchflow-cli
        run: cargo build --locked -p benchflow-cli

      - name: Docker is up
        run: docker version && docker info --format '{{.ServerVersion}} {{.Driver}}'

      # A deadline under the job's: a hung step fails this step, and the
      # transcripts below are still uploaded.
      - name: e2e smoke tier on Docker
        timeout-minutes: 20
        run: >-
          python3 e2e/run.py --bench target/debug/bench --backend docker --tier smoke
          --require-sandbox --work "$RUNNER_TEMP/e2e" --json "$RUNNER_TEMP/e2e.json"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: failure() || cancelled()
        with:
          name: e2e-docker-smoke
          path: ${{ runner.temp }}/e2e*
          if-no-files-found: ignore

  # The full tier on Docker: the network policies, every exploit probe, the
  # image-hole defenses, services, and the shell, which the smoke tier does
  # not reach. About 12 minutes on a warm machine, longer on a fresh runner;
  # so on pushes to main and bench-rs and on manual runs, not on every pull
  # request. Still no secret: the model and Daytona scenarios skip
  # themselves without their keys.
  e2e-docker-full:
    name: e2e full (docker)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (the channel in rust-toolchain.toml)
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustc --version && cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: false

      - name: cargo build -p benchflow-cli
        run: cargo build --locked -p benchflow-cli

      - name: e2e full tier on Docker
        timeout-minutes: 60
        run: >-
          python3 e2e/run.py --bench target/debug/bench --backend docker --tier full
          --require-sandbox --work "$RUNNER_TEMP/e2e" --json "$RUNNER_TEMP/e2e.json"

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        if: failure() || cancelled()
        with:
          name: e2e-docker-full
          path: ${{ runner.temp }}/e2e*
          if-no-files-found: ignore

  install-script:
    name: install.sh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Lint install.sh as POSIX sh
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck -s sh install.sh
          dash -n install.sh

  release:
    name: release (${{ matrix.target }})
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [fmt, check, e2e-docker, install-script]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # The oldest hosted Ubuntu: a glibc build needs the glibc it was
          # built against or newer (2.34+ when built on 22.04).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          # Static: runs on any x86_64 Linux. install.sh picks it on Linux.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust (the channel in rust-toolchain.toml) for ${{ matrix.target }}
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target "$TARGET" --no-self-update
          rustc --version && cargo --version

      # aws-lc-sys (rustls's crypto) compiles C, so musl needs a musl C compiler.
      - name: Install musl-tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Read the version, and check the tag matches it
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "benchflow-cli") | .version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "bench-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the Cargo workspace version: tag bench-v$version, or set [workspace.package] version in Cargo.toml to ${GITHUB_REF_NAME#bench-v} and tag again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=bench-$version-$TARGET" >> "$GITHUB_OUTPUT"

      - name: Build (cargo build --profile dist)
        run: cargo build --locked --profile dist --target "$TARGET" -p benchflow-cli

      - name: Check the binary runs and names its commit
        run: |
          bin="target/$TARGET/dist/bench"
          ls -l "$bin"
          file "$bin"
          "$bin" --help > /dev/null
          "$bin" --version | tee version.txt
          grep -Eq '^bench [^ ]+ \([0-9a-f]{9,} [0-9]{4}-[0-9]{2}-[0-9]{2}\)$' version.txt ||
            { echo "::error::bench --version does not name a commit and date"; exit 1; }
          case "$TARGET" in
            *-musl)
              libs=$(ldd "$bin" 2>&1 || true)
              echo "ldd: $libs"
              case "$libs" in
                *"=>"*) echo "::error::the musl build links shared libraries"; exit 1 ;;
              esac ;;
            *-linux-gnu)
              echo "needs glibc $(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -t. -k2,2n -k3,3n -u | tail -n 1)" ;;
          esac

      - name: Package bench-<version>-<target>.tar.gz and its .sha256
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p "dist/$NAME"
          cp "target/$TARGET/dist/bench" LICENSE "dist/$NAME/"
          cd dist
          # COPYFILE_DISABLE keeps macOS tar from adding ._ metadata files.
          COPYFILE_DISABLE=1 tar -czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          else
            shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          fi
          ls -l "$NAME.tar.gz" "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"

      - name: Install it with install.sh
        env:
          NAME: ${{ steps.version.outputs.name }}
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          sh install.sh --from "dist/$NAME.tar.gz"
          "$HOME/.local/bin/bench" --version

      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ${{ steps.version.outputs.name }}
          path: |
            dist/${{ steps.version.outputs.name }}.tar.gz
            dist/${{ steps.version.outputs.name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
