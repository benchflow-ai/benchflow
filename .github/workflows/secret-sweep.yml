name: secret-sweep

# What GitHub push protection would refuse, found before the push
# (tools/secret_sweep.py). Push protection reads every commit a push carries,
# tests included; the release leak gate reads only the wheel, the sdist and
# the docs, and 0.10.0rc4's public push was refused on a synthetic key in a
# test. On a pull request it reads the pull request's commits and its tree;
# before a public push the release owner runs it by hand on the exact range,
# `<public main>..<merge>` (docs/contributing/release-checklist.md). No
# secrets: the scanners run with --no-verification, and the log names rules,
# files and lines, never a value.

on:
  pull_request:
  push:
    branches: [main, next, 'rel-*', 'rc/*']
  merge_group:
  workflow_dispatch:
    inputs:
      base:
        description: The first commit not pushed (public main's head, from git ls-remote).
        required: true
        type: string
      tip:
        description: The commit to push (the public-main merge).
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.tip }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tip || '' }}

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install the leak scanners (pinned)
        run: tools/install_leak_scanners.sh "$RUNNER_TEMP/leak-scanners"

      - name: Sweep the range and the tree
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          INPUT_BASE: ${{ inputs.base }}
          INPUT_TIP: ${{ inputs.tip }}
        run: |
          set -euo pipefail
          tip=HEAD
          case "$EVENT" in
            pull_request) base="$PR_BASE"; tip="${{ github.event.pull_request.head.sha }}" ;;
            merge_group) base="$MERGE_BASE" ;;
            workflow_dispatch) base="$INPUT_BASE"; tip="$INPUT_TIP" ;;
            *) base="$PUSH_BEFORE" ;;
          esac
          # A new branch's push has no "before": read its last commit.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse "$tip^")"
          fi
          echo "sweeping $base..$tip"
          uv run --no-project python tools/secret_sweep.py --base "$base" --tip "$tip" \
            --scanners "$RUNNER_TEMP/leak-scanners" --json "$RUNNER_TEMP/secret-sweep.json"

      - name: Upload the hits (rule, file, line, value hash; never a value)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: secret-sweep
          path: ${{ runner.temp }}/secret-sweep.json
          if-no-files-found: ignore
          retention-days: 14
