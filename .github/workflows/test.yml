name: test

on:
  push:
    branches: [main, 'rel-*']
  pull_request:
  merge_group:
  # public-release.yml runs these jobs on the tagged commit and publishes
  # only when they all pass.
  workflow_call:

# Cancel superseded runs on a PR branch (cheap, fast-feedback unit lane), but
# never cancel push/merge_group runs on a protected ref — those gate merges and
# must complete. The two new pure-python test files
# (tests/test_opencode_proxy_tracking.py and tests/integration/rubric_checks.py
# self-tests) run automatically in this lane via the existing `pytest tests/`.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege defaults — elevate per-job only when a step needs more.
permissions:
  contents: read

# The jobs run on Ubuntu 24.04, the release gate's VMs' version
# (tools/release_gate/bootstrap_vm.sh takes no other), so CI and the gate test
# one OS. Only unit-latest-os runs on ubuntu-latest, to show the next image early.
jobs:
  unit:
    # Every Python the package lists as a classifier
    # (tests/test_workflow_uv_pin.py checks the two lists match), each in four
    # shards (pytest-split, by test count). The whole suite in one leg ran
    # past an hour, and the runner was shut down at the same 47% each time.
    # Its check runs are `unit (3.12, 1/4)` to `unit (3.13, 4/4)`; the `test`
    # job below reports the one check named `test` that main requires.
    name: unit (${{ matrix.python-version }}, ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true
          # Sets UV_PYTHON for every later step, so uv sync and uv run use it.
          python-version: ${{ matrix.python-version }}

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra sandbox-daytona --extra sandbox-modal --locked

      # The release gate's Docker, not the image's (Docker CE 28.0.4 with
      # Compose 2.38.2 on ubuntu-24.04 today): the Ubuntu packages
      # tools/release_gate/bootstrap_vm.sh installs, so these jobs test what
      # the gate tests. On the image's Docker, Compose cannot describe a
      # build-only service's output (BenchFlow refuses such builds rather than
      # guess a name), and the network policy at a sandbox's start was not
      # proven there (0.10.0rc4's tag run).
      - name: Use the release gate's Docker
        run: |
          mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
          test "${#want[@]}" -ge 5
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
          for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
            sudo rm -f "$d/docker-compose" "$d/docker-buildx"
          done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
          sudo systemctl restart docker
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
          test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"

      # EN-925, temporary (removed before merge): which resolver a
      # container's DNS forwards to on this runner.
      - name: DNS a container forwards to (EN-925 diagnostic)
        run: |
          readlink -f /etc/resolv.conf
          grep -H '^nameserver' /etc/resolv.conf /run/systemd/resolve/resolv.conf || true
          docker network create en925-dns > /dev/null
          docker run --rm --network en925-dns alpine:3.20 grep -E 'ExtServers|^nameserver' /etc/resolv.conf || true
          ip -4 route
          ip -4 -o addr show scope global
          docker run --rm --network en925-dns alpine:3.20 sh -c 'for u in https://releases.astral.sh/github/uv/releases/download/0.13.4/uv-x86_64-unknown-linux-gnu.tar.gz.sha256 https://github.com/astral-sh/uv/releases/download/0.13.4/uv-x86_64-unknown-linux-gnu.tar.gz.sha256; do wget -q -T 20 -O /dev/null "$u" && echo "egress ok $u" || echo "egress FAILED $u"; done' || true
          docker network rm en925-dns > /dev/null || true

      # A model agent's Docker trial is refused before its turn where bfx
      # can't run (integrity_unavailable), and a checkout has no bfx: git
      # ignores src/benchflow/_bfx/bin. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      # Without the browser binary the viewer's browser-level tests
      # (tests/trajectories/test_viewer_browser.py) self-skip — this step is
      # what makes them actually run in CI rather than silently pass.
      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      # Lint, format and type checks once per Python, not once per shard.
      - name: Lint
        if: matrix.shard == 1
        run: uv run ruff check src tests tools

      - name: Format check
        if: matrix.shard == 1
        run: uv run ruff format --check src tests tools

      - name: Type check
        if: matrix.shard == 1
        run: uv run ty check

      - name: Memory and disk before the tests
        run: |
          free -m
          df -h / /tmp
          df -i /
          docker info --format 'docker {{.ServerVersion}} {{.Driver}} {{json .DriverStatus}}' || true

      # The deterministic integration tier has its own job below; here it
      # would run again on the runner's Docker and double this lane's time.
      # -n auto: one pytest-xdist worker per CPU. --splits/--group: this
      # shard's quarter of the suite.
      - name: Test
        run: uv run python -m pytest tests/ -n auto --splits 4 --group ${{ matrix.shard }}
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"

      # The CPU-time ceiling checks (tests/_timing.py's within_ceiling) with no
      # xdist neighbours, which inflate CPU time on a shared core (the lead's
      # ruling, 2026-11-18); conftest leaves them out of the run above.
      - name: Ceiling checks, alone
        if: matrix.shard == 1
        run: uv run python -m pytest tests/ -m ceiling -n 0
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"

      # What the tests left behind: memory, disk, the size of the tests'
      # temporary folders, and any process the kernel killed for memory.
      - name: Memory and disk after the tests
        if: always()
        run: |
          free -m
          df -h / /tmp
          df -i /
          du -sh "$BASETEMP_ROOT" || true
          sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true
        env:
          BASETEMP_ROOT: /tmp/pytest-of-runner

  # A success-only barrier also covers partial matrix reruns, where the
  # matrix's aggregate result alone can report success for the rerun leg.
  unit-complete:
    needs: [unit]
    runs-on: ubuntu-24.04
    steps:
      - run: exit 0

  # The required check on main is named `test` (.github/integration/ADMIN_SETUP.md).
  # A matrix job reports one check per Python and none named `test`, so this
  # job carries the name: it runs even when a unit leg fails or is cancelled,
  # and passes only when every leg passed.
  test:
    needs: [unit, unit-complete]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every unit leg passed
        run: test "$UNIT_RESULT" = success && test "$UNIT_COMPLETE_RESULT" = success
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          UNIT_COMPLETE_RESULT: ${{ needs.unit-complete.result }}

  deterministic-integration:
    # Real `bench eval run` / `bench eval branch` in Docker with claude-agent-acp
    # and a scripted fake model provider (tests/integration/README.md): no
    # model keys, no model cost. Requesting docker explicitly makes a missing
    # daemon fail the job instead of skipping every scenario.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # The release gate's Docker, not the image's (Docker CE 28.0.4 with
      # Compose 2.38.2 on ubuntu-24.04 today): the Ubuntu packages
      # tools/release_gate/bootstrap_vm.sh installs, so these jobs test what
      # the gate tests. On the image's Docker, Compose cannot describe a
      # build-only service's output (BenchFlow refuses such builds rather than
      # guess a name), and the network policy at a sandbox's start was not
      # proven there (0.10.0rc4's tag run).
      - name: Use the release gate's Docker
        run: |
          mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
          test "${#want[@]}" -ge 5
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
          for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
            sudo rm -f "$d/docker-compose" "$d/docker-buildx"
          done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
          sudo systemctl restart docker
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
          test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"

      # A model agent's Docker trial is refused before its turn where bfx
      # can't run (integrity_unavailable), and a checkout has no bfx: git
      # ignores src/benchflow/_bfx/bin. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Docker info
        run: docker info --format '{{.ServerVersion}} {{.OperatingSystem}}' && docker compose version

      - name: Deterministic integration tier
        run: >-
          uv run python -m pytest tests/test_deterministic_integration.py
          tests/test_docker_parallel_isolation.py
          tests/test_integrity_deterministic.py
          -m deterministic -v -rs --durations=0
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: docker
          BENCHFLOW_DETERMINISTIC_JOBS_DIR: ${{ runner.temp }}/deterministic-jobs

      - name: Upload job folders on failure
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: deterministic-integration-jobs
          path: ${{ runner.temp }}/deterministic-jobs
          retention-days: 7

  grading-integrity:
    # What the agent leaves behind never changes its grade, grading material
    # stays closed to it, and the agent-phase network policies hold, on a real
    # Docker sandbox: script and oracle agents, and claude-agent-acp on the
    # fake model; no model keys. Its own job, so the deterministic tier keeps
    # its time limit.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # The release gate's Docker, not the image's (Docker CE 28.0.4 with
      # Compose 2.38.2 on ubuntu-24.04 today): the Ubuntu packages
      # tools/release_gate/bootstrap_vm.sh installs, so these jobs test what
      # the gate tests. On the image's Docker, Compose cannot describe a
      # build-only service's output (BenchFlow refuses such builds rather than
      # guess a name), and the network policy at a sandbox's start was not
      # proven there (0.10.0rc4's tag run).
      - name: Use the release gate's Docker
        run: |
          mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
          test "${#want[@]}" -ge 5
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
          for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
            sudo rm -f "$d/docker-compose" "$d/docker-buildx"
          done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
          sudo systemctl restart docker
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
          test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"

      # A model agent's Docker trial is refused before its turn where bfx
      # can't run (integrity_unavailable), and a checkout has no bfx: git
      # ignores src/benchflow/_bfx/bin. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Grading-integrity, grader-access and network-bypass tests
        run: >-
          uv run python -m pytest tests/test_grading_integrity_docker.py
          tests/test_grader_access_docker.py tests/test_network_bypass_docker.py
          tests/test_dry_run_capabilities.py
          -m deterministic -v -rs --durations=0
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: docker

      # The kept-service tests below guard a permission failure on the
      # trial folder Docker mounts from the host; a root host user writes
      # through it and would pass them without testing anything.
      - name: Host user is not root
        run: test "$(id -u)" != 0

      # Kept services on real Docker, as the release gate runs them. Serial:
      # the runner has 2 vCPUs. Not required yet: continue-on-error, and a
      # time limit of its own so a hang here cannot time out the job. It
      # becomes required after its first green run.
      - name: Kept-service tests
        continue-on-error: true
        timeout-minutes: 25
        run: >-
          uv run python -m pytest tests/test_keep_services_docker.py
          -m deterministic -v -rs --durations=0
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: docker

  pip-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      - name: Export the locked dependencies
        run: uv export --locked --extra dev --extra sandbox-daytona --extra sandbox-modal --format requirements-txt --no-hashes --output-file /tmp/req-audit

      # Two advisory services: PyPI's (pip-audit's default) missed
      # CVE-2026-118667 on langgraph 1.2.4, which OSV has. The OSV audit runs
      # even when the PyPI one fails, and an advisory from either fails the job.
      - name: Audit locked dependencies for known advisories (PyPI)
        run: uv run --with pip-audit pip-audit -s pypi -r /tmp/req-audit --no-deps --disable-pip

      - name: Audit locked dependencies for known advisories (OSV)
        if: ${{ !cancelled() }}
        run: uv run --with pip-audit pip-audit -s osv -r /tmp/req-audit --no-deps --disable-pip

  # The whole unit suite on the newest runner image (ubuntu-latest: Ubuntu
  # 26.04 since November 2026), to show early what the next OS breaks. Not
  # required: continue-on-error, and no job needs it. One job, so it takes
  # about two and a half hours. Never in a release: public-release.yml calls
  # this workflow, and a called workflow has the caller's name.
  unit-latest-os:
    name: unit (3.13, ubuntu-latest)
    if: github.workflow == 'test'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra sandbox-daytona --extra sandbox-modal --locked

      # EN-925, temporary (removed before merge): which resolver a
      # container's DNS forwards to on this runner.
      - name: DNS a container forwards to (EN-925 diagnostic)
        run: |
          readlink -f /etc/resolv.conf
          grep -H '^nameserver' /etc/resolv.conf /run/systemd/resolve/resolv.conf || true
          docker network create en925-dns > /dev/null
          docker run --rm --network en925-dns alpine:3.20 grep -E 'ExtServers|^nameserver' /etc/resolv.conf || true
          ip -4 route
          ip -4 -o addr show scope global
          docker run --rm --network en925-dns alpine:3.20 sh -c 'for u in https://releases.astral.sh/github/uv/releases/download/0.13.4/uv-x86_64-unknown-linux-gnu.tar.gz.sha256 https://github.com/astral-sh/uv/releases/download/0.13.4/uv-x86_64-unknown-linux-gnu.tar.gz.sha256; do wget -q -T 20 -O /dev/null "$u" && echo "egress ok $u" || echo "egress FAILED $u"; done' || true
          docker network rm en925-dns > /dev/null || true

      # A model agent's Docker trial is refused before its turn where bfx
      # can't run (integrity_unavailable), and a checkout has no bfx: git
      # ignores src/benchflow/_bfx/bin. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Memory and disk before the tests
        run: |
          free -m
          df -h / /tmp
          df -i /
          docker info --format 'docker {{.ServerVersion}} {{.Driver}} {{json .DriverStatus}}' || true

      # The four quarters one after another, with the tests' folders and
      # Docker's leftovers removed after each: the whole suite writes about
      # 17 GB (the shards above print it), more than the runner's free disk.
      - name: Test
        run: |
          status=0
          for group in 1 2 3 4; do
            echo "::group::quarter $group of 4"
            uv run python -m pytest tests/ -n auto --splits 4 --group "$group" || status=1
            df -h /
            df -i /
            du -sh "$BASETEMP_ROOT" || true
            chmod -R u+w "$BASETEMP_ROOT" 2>/dev/null || true; rm -rf "$BASETEMP_ROOT" || sudo rm -rf "$BASETEMP_ROOT"
            docker system prune -af --volumes > /dev/null || true
            echo "::endgroup::"
          done
          exit "$status"
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"
          BASETEMP_ROOT: /tmp/pytest-of-runner

      # The CPU-time ceiling checks (tests/_timing.py's within_ceiling) with no
      # xdist neighbours, which inflate CPU time on a shared core (the lead's
      # ruling, 2026-11-18); conftest leaves them out of the run above.
      - name: Ceiling checks, alone
        run: uv run python -m pytest tests/ -m ceiling -n 0
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"

      - name: Memory and disk after the tests
        if: always()
        run: |
          free -m
          df -h / /tmp
          df -i /
          sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true
