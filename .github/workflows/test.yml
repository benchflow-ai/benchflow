        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: docker
          BENCHFLOW_WINDOW_RUNS: "3"

  # Gate 1 on a sample: BenchFlow's oracle against Harbor 0.26.0's on 12 tasks
  # CI can fetch from their public sources (20 when grading changes), drawn by
  # this tree's hash, each mismatch re-run alone and read with R732B's classes
  # (tools/parity). The full 404 run at night.
  # A cold image build counts: researchcodebench's took 18.5 min on a loaded VM.
  oracle-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HARBOR_TELEMETRY: "off"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      # Outside the checkout, under the runner's temp folder: upload-artifact
      # refuses a path with "..", so a workspace-relative ../parity lost the
      # rows of every run.
      - name: Where the parity files go
        run: echo "PARITY=$RUNNER_TEMP/parity" >> "$GITHUB_ENV"

      # The hosted runner keeps about 14 GB free on /; the sampled tasks' images
      # (algotune, codepde, lawbench) need more. On 0c6fc44e their builds failed
      # here and passed on a gate VM (oracle-parity 12/12 there). The SDKs this
      # job never uses go first.
      - name: Free the runner's disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift || true
          df -h /

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --locked

      # The release gate's Docker, not the image's (Docker CE 28.0.4 with
      # Compose 2.38.2 on ubuntu-24.04 today): the Ubuntu packages
      # tools/release_gate/bootstrap_vm.sh installs, so these jobs test what
      # the gate tests. On the image's Docker, Compose cannot describe a
      # build-only service's output (BenchFlow refuses such builds rather than
      # guess a name), and the network policy at a sandbox's start was not
      # proven there (0.10.0rc4's tag run).
      - name: Use the release gate's Docker
        run: |
          mapfile -t want < <(sed -n '/^UBUNTU_PACKAGES=(/,/^)/{/^ /p}' tools/release_gate/bootstrap_vm.sh | tr -d ' ')
          test "${#want[@]}" -ge 5
          # A gate VM (a self-hosted runner, gate-dispatch.yml) already has
          # these packages; removing them there deletes their plugin files.
          if [ "$(docker version --format '{{.Server.Version}}' 2>/dev/null)" = 29.1.3 ] \
            && [ "$(docker compose version --short 2>/dev/null)" = "2.40.3+ds1-0ubuntu1~24.04.1" ]; then
            echo "the gate's Docker is already installed"; exit 0
          fi
          sudo systemctl stop docker.socket docker.service containerd.service || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get remove -y -q docker-ce docker-ce-cli docker-ce-rootless-extras containerd.io docker-buildx-plugin docker-compose-plugin || true
          for d in /usr/libexec/docker/cli-plugins /usr/local/lib/docker/cli-plugins "$HOME/.docker/cli-plugins"; do
            sudo rm -f "$d/docker-compose" "$d/docker-buildx"
          done
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --allow-downgrades "${want[@]}"
          sudo systemctl restart docker
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
          test "$(docker version --format '{{.Server.Version}}')" = 29.1.3
          test "$(docker compose version --short)" = "2.40.3+ds1-0ubuntu1~24.04.1"

      # A model agent's Docker trial is refused before its turn where bfx
      # can't run (integrity_unavailable), and a checkout has no bfx: git
      # ignores src/benchflow/_bfx/bin. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Draw the sample
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mkdir -p "$PARITY"
          base=""
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --deepen=500 origin HEAD || true
            git fetch --no-tags --depth=500 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            base="origin/$BASE_REF"
          fi
          uv run python -m tools.parity.sample --repo . --rev HEAD ${base:+--base "$base"} \
            --out "$PARITY/sample.tsv"

      - name: Fetch the tasks from their public sources
        run: uv run python -m tools.parity.fetch --sample "$PARITY/sample.tsv" --dest "$PARITY/tasks"

      - name: Run the oracle, then each mismatch alone
        run: >-
          uv run python -m tools.parity.run --sample "$PARITY/sample.tsv"
          --tasks "$PARITY/tasks" --jobs "$PARITY/jobs"
          --out "$PARITY/rows.tsv" --reruns "$PARITY/reruns.tsv"
          --bench "$PWD/.venv/bin/bench" -P "$(( $(nproc) > 3 ? $(nproc) / 2 : 1 ))"

      - name: Tally against Harbor 0.26.0
        run: >-
          uv run python -m tools.parity.tally --rows "$PARITY/rows.tsv"
          --reruns "$PARITY/reruns.tsv" --mode pr --summary "$GITHUB_STEP_SUMMARY"

      # Each trial that ended without a score: its own error, whole, and the
      # runner's disk, so a failure here can be told from the runner's.
      - name: What the unscored trials say
        if: failure()
        run: |
          df -h / "$RUNNER_TEMP"
          docker system df || true
          find "$PARITY/jobs" -name result.json -print0 2>/dev/null \
            | xargs -0 -r jq -r 'select(.error != null and .error != "") | "\(input_filename): \(.error)"' \
            | cut -c1-4000

      - name: Upload the rows
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: oracle-parity-rows
          path: |
            ${{ env.PARITY }}/sample.tsv
            ${{ env.PARITY }}/rows.tsv
            ${{ env.PARITY }}/reruns.tsv
          if-no-files-found: ignore
          retention-days: 14

  # The whole unit suite on the newest runner image (ubuntu-latest: Ubuntu
  # 26.04 since November 2026), to show early what the next OS breaks. Not
  # required: continue-on-error, and no job needs it. One job, so it takes
  # about two and a half hours. Never in a release: public-release.yml calls
  # this workflow, and a called workflow has the caller's name.
  unit-latest-os:
    name: unit (3.13, ubuntu-latest)
    if: github.workflow == 'test'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          # uv 0.13.4 and its sha256 for this x86_64 Linux runner:
          # src/benchflow/_uv_pin.py (tests/test_workflow_uv_pin.py checks).
          version: "0.13.4"
          checksum: "2b428396f12572d4429cf210ca234dd599a33b3af0958a4d5ed569d63e3f344f"
          enable-cache: true
          python-version: "3.13"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev --extra sandbox-daytona --extra sandbox-modal --locked

      # A model agent's Docker trial is refused before its turn where bfx
      # can't run (integrity_unavailable), and a checkout has no bfx: git
      # ignores src/benchflow/_bfx/bin. Build the pinned x86_64 binary from
      # source as the release does; the build stops on any other bytes.
      - name: Install the bfx toolchain
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' bfx/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-musl

      - name: Build bfx (pinned)
        run: BFX_REQUIRE_PIN=1 BFX_ARCHES=x86_64 scripts/build_bfx.sh

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Memory and disk before the tests
        run: |
          free -m
          df -h / /tmp
          df -i /
          docker info --format 'docker {{.ServerVersion}} {{.Driver}} {{json .DriverStatus}}' || true

      # The four quarters one after another, with the tests' folders and
      # Docker's leftovers removed after each: the whole suite writes about
      # 17 GB (the shards above print it), more than the runner's free disk.
      - name: Test
        run: |
          status=0
          for group in 1 2 3 4; do
            echo "::group::quarter $group of 4"
            uv run python -m pytest tests/ -n auto --splits 4 --group "$group" || status=1
            df -h /
            df -i /
            du -sh "$BASETEMP_ROOT" || true
            chmod -R u+w "$BASETEMP_ROOT" 2>/dev/null || true; rm -rf "$BASETEMP_ROOT" || sudo rm -rf "$BASETEMP_ROOT"
            docker system prune -af --volumes > /dev/null || true
            echo "::endgroup::"
          done
          exit "$status"
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"
          BASETEMP_ROOT: /tmp/pytest-of-runner

      # The CPU-time ceiling checks (tests/_timing.py's within_ceiling) with no
      # xdist neighbours, which inflate CPU time on a shared core (the lead's
      # ruling, 2026-11-18); conftest leaves them out of the run above.
      - name: Ceiling checks, alone
        run: uv run python -m pytest tests/ -m ceiling -n 0
        env:
          BENCHFLOW_DETERMINISTIC_SANDBOX: "off"

      - name: Memory and disk after the tests
        if: always()
        run: |
          free -m
          df -h / /tmp
          df -i /
          sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -20 || true
