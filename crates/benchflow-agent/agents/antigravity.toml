# Google Antigravity through Google's own ACP server for it, the archive the
# public ACP registry lists for antigravity-acp 1.3.0, or headless with the
# Antigravity CLI, `agy --prompt` (Harbor's `antigravity-cli`), pinned to
# agy 1.3.3 from Google's auto-updater manifest with its SHA-512. The ACP
# server does not carry agy, so one install fetches both. BenchFlow 0.8 ran
# agy 1.2.7 through a Python shim over the same stream-json mode; the shim
# is not ported now that Google ships an ACP server.
name = "antigravity"
aliases = ["agy", "antigravity-cli", "antigravity-acp"]
description = "Google Antigravity via ACP, or headless with agy --prompt (needs a Gemini API key)"
acp_registry = "antigravity-acp"
skill_paths = ["$HOME/.gemini/config/skills", "$WORKSPACE/.agents/skills"]
home_dirs = [".gemini"]

[install]
installer = '''
set -eu
case "$(uname -m)" in
  x86_64|amd64)
    acp=https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-1.3.0-linux-x86_64.zip
    cli=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.3.3-5524738307653632/linux-x64/cli_linux_x64.tar.gz
    sha=abe3ddf5cf30d3adaa586acf505221aa19702f5ca71af3c8b1f9b1a5976bd8e5c151c41ea33b39c41675d25843462a3e8c382c054f580e9d7e1688919d3b5110 ;;
  aarch64|arm64)
    acp=https://dl.google.com/agy-extensions/releases/linux/agy-acp-server-1.3.0-linux-arm64.zip
    cli=https://storage.googleapis.com/antigravity-public/antigravity-cli/1.3.3-5524738307653632/linux-arm/cli_linux_arm64.tar.gz
    sha=1bfd3503576219a102176c13579665a2f39e84ac86a904b117d3b33f3dd751f194a862496bad6ffe914ad46d2c877ba12b6c07e6db07128b706d238262fe430c ;;
  *) echo "BenchFlow: Antigravity publishes no build for linux-$(uname -m)" >&2; exit 1 ;;
esac
if ! command -v unzip > /dev/null 2>&1; then
  if command -v apt-get > /dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq unzip;
  elif command -v dnf > /dev/null 2>&1; then dnf -y install unzip;
  elif command -v apk > /dev/null 2>&1; then apk add --no-cache unzip;
  else echo 'BenchFlow: the Antigravity install needs unzip, and the image has no apt-get, dnf or apk to add it' >&2; exit 127; fi
fi
if [ ! -x acp/agy_acp_server.par ]; then
  rm -rf acp && mkdir acp
  curl -fsSL --retry 3 -o acp.zip "$acp"
  unzip -q -o acp.zip -d acp
  rm -f acp.zip
  chmod +x acp/agy_acp_server.par
fi
# The ACP server runs by its real path, next to its harness binary.
printf '#!/bin/sh\nexec %s/acp/agy_acp_server.par "$@"\n' "$PWD" > acp/antigravity
chmod 755 acp/antigravity
if [ ! -x cli/agy ]; then
  rm -rf cli && mkdir cli
  curl -fsSL --retry 3 -o cli.tar.gz "$cli"
  got=$( (sha512sum cli.tar.gz 2> /dev/null || shasum -a 512 cli.tar.gz) | cut -d ' ' -f 1)
  [ "$got" = "$sha" ] || { echo "BenchFlow: $cli has SHA-512 $got, not the $sha Google's manifest lists" >&2; exit 1; }
  tar -xzf cli.tar.gz -C cli --no-same-owner
  rm -f cli.tar.gz
  mv cli/antigravity cli/agy
  chmod 755 cli/agy
fi
'''
links = ["acp/antigravity", "cli/agy"]
verify = "/opt/benchflow/bin/agy --version"

[launch]
command = "exec /opt/benchflow/bin/antigravity --uid="

[headless]
# Harbor's `agy --prompt ... --output-format stream-json` in Gemini API-key
# mode: GEMINI_API_KEY (a GOOGLE_API_KEY under agy's name), with
# `modelProvider: gemini` in its settings so it skips the sign-in screen.
# agy wants an effort for every model in key mode (BenchFlow 0.8's shim):
# the run's, mapped onto low, medium and high, else high.
command = '''export GEMINI_API_KEY="${GEMINI_API_KEY:-$GOOGLE_API_KEY}"
s="$HOME/.gemini/antigravity-cli"
mkdir -p "$s"
if [ -n "$GEMINI_API_KEY" ]; then p='"modelProvider": "gemini", '; else p=''; fi
printf '{%s"allowNonWorkspaceAccess": true, "enableTelemetry": "off", "experimental": {"skills": true}}\n' "$p" > "$s/settings.json"
case "${BENCHFLOW_EFFORT:-high}" in
  none|minimal|low) e=low ;;
  medium) e=medium ;;
  *) e=high ;;
esac
exec /opt/benchflow/bin/agy --dangerously-skip-permissions --print-timeout 24h --output-format stream-json \
  --add-dir "$PWD" ${BENCHFLOW_MODEL:+--model "$BENCHFLOW_MODEL"} --effort "$e" --prompt="$(cat "$BENCHFLOW_INSTRUCTION_FILE")" < /dev/null'''
output = "antigravity-stream-json"
env = { GEMINI_CLI_TRUST_WORKSPACE = "true" }

[credentials]
family = "env"
env = ["GEMINI_API_KEY", "GOOGLE_API_KEY"]
account = "a Gemini API key from https://aistudio.google.com/apikey, set as GEMINI_API_KEY; Google sign-in lives in the OS keyring and cannot be copied into a sandbox"

[model]
select = "auto"
default = "gemini-3.8-flash"
strip_prefixes = ["google/", "gemini/"]
