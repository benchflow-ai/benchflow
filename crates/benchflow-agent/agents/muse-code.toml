# Muse Code (Meta), run headless with `muse exec --json`, as Harbor's
# `muse-code` agent runs it. It needs a Meta Model API key; the models are
# Meta's.
name = "muse-code"
aliases = ["muse"]
description = "Muse Code (Meta), headless with muse exec --json; needs a Meta Model API key"
# Muse's skills folder under its config home (XDG_CONFIG_HOME, by default
# ~/.config), where Harbor copies them.
skill_paths = ["$HOME/.config/muse/skills"]

[install]
# Meta's installer: a launcher that downloads the current stable binary
# (Meta publishes no pinned release), here once, at install.
installer = '''
set -eu
if ! command -v bash > /dev/null 2>&1; then
  if command -v apt-get > /dev/null 2>&1; then apt-get update -qq && apt-get install -y -qq bash;
  elif command -v dnf > /dev/null 2>&1; then dnf -y install bash;
  elif command -v apk > /dev/null 2>&1; then apk add --no-cache bash;
  else echo 'BenchFlow: the Muse installer needs bash, and the image has no apt-get, dnf or apk to add it' >&2; exit 127; fi
fi
curl -fsSL https://dev.meta.ai/install.sh | MUSE_NO_MODIFY_PATH=1 bash
'''
links = [".local/bin/muse"]
verify = "MUSE_NO_AUTO_UPDATE=1 /opt/benchflow/bin/muse --version"

[headless]
# `meta/<model>` and a bare model name are Muse's model; MUSE_CODE_BASE_URL
# points it at another Meta endpoint.
command = '''m="${BENCHFLOW_MODEL#meta/}"
exec /opt/benchflow/bin/muse exec --json --yolo --user-input-auto-resolve --prompt-file "$BENCHFLOW_INSTRUCTION_FILE" \
  ${m:+--model "$m"} ${BENCHFLOW_EFFORT:+--reasoning-effort "$BENCHFLOW_EFFORT"} ${MUSE_CODE_BASE_URL:+--base-url "$MUSE_CODE_BASE_URL"} < /dev/null'''
output = "muse-json"
env = { MUSE_NO_AUTO_UPDATE = "1" }

[credentials]
env = ["META_API_KEY"]
account = "a Meta Model API key from https://dev.meta.ai: `export META_API_KEY=<key>`"

[model]
select = "none"
