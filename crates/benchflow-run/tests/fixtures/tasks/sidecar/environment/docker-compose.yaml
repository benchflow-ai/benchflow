# Service main is the agent's container, which BenchFlow configures.
services:
  main:
    depends_on:
      api:
        condition: service_healthy
  api:
    build:
      context: ./api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/token"]
      interval: 1s
      timeout: 5s
      retries: 30
