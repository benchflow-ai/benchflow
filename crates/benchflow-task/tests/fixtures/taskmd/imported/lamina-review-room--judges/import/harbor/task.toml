schema_version = "1.3"
multi_step_reward_strategy = "final"
artifacts = ["/app/.lamina"]

[task]
name = "aryaniyaps/dev-review-room-lamina-v3"
description = "LB6 development pilot: dev-review-room (lamina) — RewardKit LLM judge; not claim-ready LaminaBench-6"
authors = [{ name = "LaminaBench" }]
keywords = ["fuzzy-prompt", "development-pilot", "lb6", "lamina", "rewardkit"]

[metadata]
benchmark = "lamina-lb6-pilot"
benchmark_version = "lb6-dev-pilot-v3"
campaign_id = "lb6-dev-pilot-skill-rerun-v3"
task_id = "dev-review-room"
arm = "lamina"
kind = "greenfield-privacy"
stage = "shape"
development_only = true
confirmatory = false
child_actual_model_unverified = true
host_sealed_supervisor_required = false
measurement_contract = "rewardkit_llm_judge_v3"
harbor_version = "0.18.0"
agent = "cursor-cli"
model = "cursor/composer-2.5"

[agent]
timeout_sec = 1500.0

[verifier]
timeout_sec = 300.0

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY}"
REWARDKIT_JUDGE = "${REWARDKIT_JUDGE}"
LITELLM_DROP_PARAMS = "1"

[environment]
docker_image = "lb6-pilot-agent-runtime:cursor-20260720"
network_mode = "public"
build_timeout_sec = 180.0
workdir = "/app"
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240

[[steps]]
name = "lamina_init"
min_reward = 0.0
[steps.agent]
timeout_sec = 240.0
[steps.verifier]
timeout_sec = 45.0

[[steps]]
name = "lamina_design"
min_reward = 0.0
[steps.agent]
timeout_sec = 360.0
[steps.verifier]
timeout_sec = 45.0

[[steps]]
name = "implement"
min_reward = 0.0
[steps.agent]
timeout_sec = 600.0
[steps.verifier]
timeout_sec = 45.0

[[steps]]
name = "fix"
min_reward = 0.0
artifacts = ["/app/app.mjs", "/app/index.html", "/app/ui.mjs", "/app/styles.css"]
[steps.agent]
timeout_sec = 300.0
[steps.verifier]
timeout_sec = 300.0
