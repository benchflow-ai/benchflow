# A credential file in the build folder: bench test (oracle passes, nop fails, and an environment probe scores no more than nop, and the credential scan names the .netrc the agent user can read).
tier = "full"
needs = ["sandbox"]
tasks = ["leaves-credentials"]

[[step]]
run = ["test", "tasks/leaves-credentials", "--probes", "env-inject", "-s", "{backend}", "-j", "{j}"]
exit = 0
timeout = 1500
output_lacks = ['VULNERABLE']
trials = [{ job = "tests/*", agent = "oracle", status = "scored", reward = 1.0 }, { job = "tests/*", agent = "nop", status = "scored", reward = 0.0 }, { job = "tests/*", agent = "probe:*", status = "scored", reward = 0.0 }]
stdout_has = ['/opt/deploy/\.netrc .*the agent user can read it']
