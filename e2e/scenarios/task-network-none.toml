# Network policy none: bench test (oracle passes, nop and controls fail).
tier = "full"
needs = ["sandbox"]
tasks = ["network-none"]

[[step]]
run = ["test", "tasks/network-none", "--probes", "none", "-s", "{backend}", "-j", "{j}"]
exit = 0
timeout = 1500
trials = [{ job = "tests/*", agent = "oracle", status = "scored", reward = 1.0 }, { job = "tests/*", agent = "nop", status = "scored", reward = 0.0 }, { job = "tests/*", agent = "control:*", status = "scored", reward = 0.0 }]

[[step]]
name = "the policy is recorded as enforced"
run = ["run", "tasks/network-none", "-s", "{backend}", "--job", "o"]
exit = 0
trials = [{ job = "o", status = "scored", reward = 1.0, result = { "defenses.network_policy.state" = "enforced" } }]
