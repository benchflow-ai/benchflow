# A split-layout task: bench test (oracle passes, nop and controls fail).
tier = "full"
needs = ["sandbox"]
tasks = ["hello-split"]

[[step]]
run = ["test", "tasks/hello-split", "--probes", "none", "-s", "{backend}", "-j", "{j}"]
exit = 0
timeout = 1500
trials = [{ job = "tests/*", agent = "oracle", status = "scored", reward = 1.0 }, { job = "tests/*", agent = "nop", status = "scored", reward = 0.0 }]
