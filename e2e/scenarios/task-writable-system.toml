# An image with writable system folders, and a control that solves the task only by writing one: bench test (oracle passes, nop fails, and the probe aimed at the hole scores no more than nop; the defense is recorded as repaired).
tier = "full"
needs = ["sandbox"]
tasks = ["writable-system"]

[[step]]
run = ["test", "tasks/writable-system", "--probes", "path-shadow,harness-tamper", "-s", "{backend}", "-j", "{j}"]
exit = 0
timeout = 1500
output_lacks = ['VULNERABLE']
trials = [{ job = "tests/*", agent = "oracle", status = "scored", reward = 1.0, result = { "defenses.locked_system_dirs.state" = "failed", "defenses.locked_system_dirs.note" = { matches = "removed that permission before the agent ran" } } }, { job = "tests/*", agent = "nop", status = "scored", reward = 0.0 }, { job = "tests/*", agent = "probe:*", status = "scored", reward = 0.0, result = { "defenses.locked_system_dirs.state" = "failed", "defenses.locked_system_dirs.note" = { matches = "removed that permission before the agent ran" } } }, { job = "tests/*", agent = "control:write-hole", status = "scored", reward = 0.0 }]
