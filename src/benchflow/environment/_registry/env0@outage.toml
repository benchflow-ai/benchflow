# env0@outage — env-0 with the gmail + slack services removed.
#
# A perturbation variant for the "Same state, tool outage" experiment: bind the
# SAME task to env0@prod vs env0@outage and attribute the reward delta to the
# environment alone (the S axis). A task that needs slack (port 9005) scores 1.0
# under env0@prod and fails under env0@outage because the service is absent.
#
# Shipped inside the benchflow wheel (benchflow/environment/_registry/), so it
# resolves on a bare pip install with no $BENCHFLOW_ENV_REGISTRY set:
#
#   bench eval create --tasks-dir <task> --environment-manifest env0@outage ...
#
# NOTE: ghcr.io/benchflow-ai/env0:0.2.0 is amd64-only — run env0 on Daytona
# (x86_64), not local Docker on Apple Silicon.

[environment]
name           = "env-0"
base_image     = "ghcr.io/benchflow-ai/env0:0.2.0"
owns_lifecycle = false
isolation      = "per_task"

[environment.task_selection]
mechanism = "image"

[environment.readiness]
timeout_sec = 60

# Services below are copied VERBATIM from the upstream env-0.toml pin,
# minus this variant's deliberate outage (mock-gmail and mock-slack
# removed).

[[environment.services]]
name    = "mock-auth"
command = "mock-auth --db /data/auth.db serve --host 0.0.0.0 --port 9000 --no-mcp"
port    = 9000


[[environment.services]]
name    = "mock-gcal"
command = "mock-gcal --db /data/gcal.db serve --host 0.0.0.0 --port 9002 --no-mcp"
port    = 9002

[[environment.services]]
name    = "mock-gdrive"
command = "mock-gdrive --db /data/gdrive.db serve --host 0.0.0.0 --port 9003 --no-mcp"
port    = 9003

[[environment.services]]
name    = "mock-gdoc"
command = "mock-gdoc --db /data/gdoc.db serve --host 0.0.0.0 --port 9004 --no-mcp"
port    = 9004


[[environment.services]]
name    = "mock-discord"
command = "mock-discord --db /data/discord.db serve --host 0.0.0.0 --port 9006 --no-mcp"
port    = 9006

[[environment.services]]
name    = "mock-stripe"
command = "mock-stripe --db /data/stripe.db serve --host 0.0.0.0 --port 9007 --no-mcp"
port    = 9007
