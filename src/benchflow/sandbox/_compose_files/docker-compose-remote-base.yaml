# Base for the remote-docker provider: docker-compose-base.yaml without the
# host bind mounts. A remote daemon cannot see the caller's rollout folders;
# logs, verifier output and artifacts are copied back instead.
services:
  main:
    labels:
      # "process": the leftover sweep removes it only once the BenchFlow
      # process named below is gone (_docker_sweep.py). Not "true", which
      # BenchFlow before 0.8 prunes daemon-wide, live containers included.
      benchflow.owned: "process"
      benchflow.process: "${BENCHFLOW_PROCESS:-}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY}
networks:
  default:
    labels:
      benchflow.owned: "process"
      benchflow.process: "${BENCHFLOW_PROCESS:-}"
