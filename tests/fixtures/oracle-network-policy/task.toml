version = "1.0"

[metadata]
author_name = "benchflow"
difficulty = "easy"
category = "sanity"
tags = ["network-policy", "oracle"]

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 4096
# The oracle below reaches example.com, which this list does not name, so it
# proves nothing about the task under its policy (REPORT B10): it scores 1
# only when the policy does not cover the oracle.
network_mode = "allowlist"
allowed_hosts = ["pypi.org"]
