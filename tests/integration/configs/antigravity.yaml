# Integration test: antigravity (Google Antigravity CLI, agy)
source:
  repo: benchflow-ai/skillsbench
  path: tasks
  ref: main

jobs_dir: jobs/integration/antigravity
agent: antigravity
model: gemini-3.8-flash
environment: daytona
concurrency: 64
max_retries: 1

include:
  - jax-computing-basics
  - python-scala-translation
  - jpg-ocr-stat
  - grid-dispatch-operator
  - threejs-to-obj
  - data-to-d3
  - lake-warming-attribution
  - weighted-gdp-calc
  - shock-analysis-supply
