# The task trees the harness runs, each pinned as <source>/<path>@<git tree
# hash>. run.py fetches a tree with `git archive <source commit> <path>` and
# checks the hash of what it unpacked against the pin before any cell runs;
# no tree is copied into this repository.
#
# `weight` marks the slow tasks (timeouts, retries, big images), which run.py
# starts first in each round.
#
# `name` is the cell's name (and the folder the task copy runs from), unique
# across the corpus; cells pair on name plus tree hash, never on task_digest.
# The smoke tier is what the oracle and nop can run with no model and no key:
# Rust 0.8.2's examples (integ/p1:examples/README.md:35-86), the engine
# bench's control tasks (../engine-bench-1015/raw/trials/setup.txt), and the
# refusals both engines document. Left out: hello-tb1 (needs `bench import`),
# check-errors (invalid on purpose), desktop-hello (a desktop image),
# rubric-judged (a model judge), net-open and net-none (by hand only,
# README E54m) and the converter's copy of nanofirm-task (the same tree as
# nanofirm-task). terminal-bench-smoke-task, the engine bench's sixth task,
# is in neither source commit: it comes from 0.6.0-rc.6 (DT3-MJ2).

