# A planner refusal has no summary. The completed Rust control's common
# ratios must still be exactly the documented 1 (oracle) or 0 (nop), rather
# than being covered by the outcome/refusal rows above (CONF2-DT1-1).
[[row]]
id = "load-refusal-oracle-summary"
mode = "cross-engine"
cells = ["clock-start/oracle", "mount-outputs/oracle", "net-blocklist/oracle", "net-ip-blocklist/oracle", "stages/oracle", "timezone/oracle", "world-sim/oracle"]
class = "summary_change"
exact_fields = true
fields = ["score_ratio <missing> -> 1", "score_ratio <missing> -> 1.0", "score_excl_errors_ratio <missing> -> 1", "score_excl_errors_ratio <missing> -> 1.0"]
spec_side = "rust"
owner = "Python BenchFlow (task.md planner)"
cite = "integ/p1:examples/README.md (oracle controls); a recorded run (three-round passed controls)"
reason = "Python writes no summary when refused at load; Rust's oracle is exactly 1"

