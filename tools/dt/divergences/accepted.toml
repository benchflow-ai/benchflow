[[row]]
id = "build-timeout-warm-cache"
mode = "cross-engine"
cells = ["build-timeout/*"]
class = "spec_mismatch"
spec_side = "neither"
owner = "task (the build VM's BuildKit cache)"
cite = "integ/p1:examples/README.md:69 (E23b: errored, R102); Python 0.8 enforces no build timeout on Docker (src/benchflow/sandbox/docker.py:739 times only a pre-compose hook), so its first build ran the full 300 s and left the layer in the shared BuildKit cache (a recorded run: build-timeout oracle 315 s, passed)"
reason = "on a VM where the 300 s layer is cached, neither engine's build outlives 15 s, so both pass; Python's missing build timeout is listed as a finding for its owner"

