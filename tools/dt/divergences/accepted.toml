spec_side = "n/a"
owner = "Python BenchFlow"
cite = "src/benchflow/task/imports.py:52-61 ([[verifier.collect]] is an unhonoured foreign key, refused by the runtime capability check)"
reason = "Python does not run verifier collect hooks and refuses the task (R401, unsupported_task_feature); Rust runs them"

