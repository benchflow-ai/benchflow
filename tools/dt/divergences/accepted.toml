# Known differences between Python BenchFlow and Rust 0.8.2 that stay. Each
# row names its cells ("<corpus name>/<agent>", globs allowed), the class
# (and, for field or verifier changes, the fields) it explains, which side
# matches the documented behaviour (`spec_side`: python, rust, both,
# neither, n/a when spec/expected.toml has no row), an owner and a cite.
# A row that matches nothing in a full run of its tiers (default smoke)
# fails the run. REL's "Differences from the Rust engine" text (DT3) is
# built from these rows.

[[row]]
id = "acp_smoke-rust-refuses"
mode = "cross-engine"
cells = ["acp_smoke/oracle", "acp_smoke/nop"]
class = "rust_refuses_python_runs"
spec_side = "n/a"
owner = "Rust 0.8.2"
cite = "integ/p1:crates/benchflow-task/src/compose.rs:811-814 (services.main.working_dir: service main is the agent's container, R401)"
reason = "Rust refuses a compose file that sets the main service's working_dir; Python runs the task as 0.8 did"

[[row]]
id = "snapshot-hook-python-refuses"
mode = "cross-engine"
cells = ["snapshot-hook/oracle", "snapshot-hook/nop"]
