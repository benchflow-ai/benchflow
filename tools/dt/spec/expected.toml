# The documented behaviour, independent of both engines: the third judge.
# For every cross-engine difference on a cell that has a row here, the
# comparer says which side matches the documentation (spec_mismatch names
# the side that does not), and every ledger row's `spec_side` must agree.
#
# outcome: passed / failed / errored / unscored / refused (refused before any
# sandbox starts, recorded or at load). `code` is the Rust R-code the
# documentation names ("" for none); a Python record matches it through its
# failure family (categories.toml). `reward` is checked when given.
#
# Sources: integ/p1:examples/README.md:35-86 (the outcomes that need no
# model), and Python's 9 deterministic goldens
# (tests/integration/deterministic/golden/*.json, run by DT3's golden tier
# with claude-agent-acp, codex-acp for in-sandbox-proxy-usage, against the
# scripted fake provider).

