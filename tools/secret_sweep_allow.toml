# Exceptions to the push-protection sweep (tools/secret_sweep.py), for scanner hits that GitHub push protection
# does not refuse: gitleaks' and trufflehog's generic rules. Each binds the tool, the rule, the path and the
# SHA-256 of the matched value (the sweep's --json output gives it), with a reason and an expiry. A provider
# pattern (tool "ghpp") can't be listed here: push protection refuses it whatever this file says.
#
# [[allow]]
# tool = "gitleaks"
# rule = "generic-api-key"
# path = "tests/fixtures/example.json"
# value_sha256 = "<64 hex>"
# reason = "a fixture's 64-character hash under a field named key"
# expires = "2027-06-01"

[[allow]]
tool = "trufflehog"
rule = "URI"
path = "tests/test_hosted.py"
value_sha256 = "31ea6f4859b9c2904ab84017174c1a2bcdfda2717fa5214b919e6e03d885aaee"
reason = "a made-up user:password URL on cpa.example.com in the https-only endpoint row (rc4 9690ad75); no real credential"
expires = "2027-05-18"

[[allow]]
tool = "trufflehog"
rule = "URI"
path = "tests/test_hosted_dogfood_gaps.py"
value_sha256 = "31ea6f4859b9c2904ab84017174c1a2bcdfda2717fa5214b919e6e03d885aaee"
reason = "the same made-up cpa.example.com URL in rc4's dogfood-gap rows (4b498dfa), a file since removed; no real credential"
expires = "2027-05-18"

[[allow]]
tool = "gitleaks"
rule = "generic-api-key"
path = "tests/test_staged_secret_masking.py"
value_sha256 = "79c1e429bd384461f844a949a75fb6d098b84f8bf48b746e5994c22ef22d4729"
reason = "a made-up proxy key placeholder in the staged-credential masking rows' first commit (f75a6beb), renamed since; no real credential"
expires = "2027-05-20"

[[allow]]
tool = "gitleaks"
rule = "generic-api-key"
path = "tests/test_staged_secret_masking.py"
value_sha256 = "656aa2fc501db1fca1cc3a0ea937fd6a9e6eede6f435afeed8e0077c8b415b7d"
reason = "a made-up Vertex client_secret placeholder in the staged-credential masking rows' first commit (f75a6beb), held in a constant since; no real credential"
